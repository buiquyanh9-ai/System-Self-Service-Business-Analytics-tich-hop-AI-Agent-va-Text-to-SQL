# Triển khai lên Render (Blueprint). Railway/Fly cũng dùng được Dockerfile này.
services:
  - type: web
    name: data01-text2sql
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY    # để trống cả hai khóa -> chạy bộ luật offline
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-6-luna
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODE
        value: auto
      - key: SUPABASE_JWT_SECRET   # tùy chọn: chấp nhận access token của Supabase Auth
        sync: false
