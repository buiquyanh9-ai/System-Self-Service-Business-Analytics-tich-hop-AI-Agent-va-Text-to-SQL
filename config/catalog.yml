# =====================================================================================
# DATA CATALOG — mô tả nghiệp vụ cho bảng/cột (tên cột viết tắt kiểu kho dữ liệu thật).
# Được index vào bộ tìm kiếm schema (RAG) và đưa vào prompt cho LLM. Admin có thể sửa trên giao diện.
# sensitivity: pii | confidential  -> bị chặn với vai trò analyst (xem config/policies.yml)
# =====================================================================================

# Quy tắc lint SQL riêng của kho này (app/sqlcheck.py đọc mục này; kho khác khai báo theo bảng của mình)
lint:
  fanout:                 # cộng cột cấp ĐƠN sau khi JOIN bảng cấp DÒNG -> mỗi đơn bị cộng nhiều lần (lỗi, tự sửa)
    - header: dw.fct_dh
      measures: [tong_tt, tien_hang, tien_ck, phi_vc, so_dong]
      line: dw.fct_ct_dh
      hint: "Tổng hợp fct_dh riêng (hoặc dùng cột tt của fct_ct_dh) trước khi JOIN."
      # biểu thức tương đương trên bảng cấp dòng để tự sửa ({line} = bí danh của bảng cấp dòng trong truy vấn)
      line_equivalents: {tong_tt: "{line}.tt", tien_hang: "{line}.sl * {line}.dg", tien_ck: "{line}.ck"}
  required_filters:       # tính tổng các cột này mà không nhắc tới cột trạng thái -> cảnh báo
    - tables:
        dw.fct_ct_dh: [tt, dg, sl, ck, tien_tra]
        dw.fct_dh: [tong_tt, tien_hang, tien_ck]
      column: trang_thai
      message: "Tính tổng tiền bán hàng nhưng KHÔNG lọc trạng thái đơn — đang cộng cả đơn hủy/đang giao."
      hint: "Theo semantic layer: doanh thu thuần chỉ tính trang_thai = 'HOAN_THANH'; doanh thu gộp loại trang_thai = 'HUY'."
  semi_additive:          # chỉ số ảnh chụp: không cộng qua nhiều ngày chốt
    - table: dw.fct_tk_tuan
      measures: [sl_ton, gia_tri_ton, sl_dang_ve]
      snapshot_column: ngay_chot
      label: tồn kho

tables:
  dw.fct_ct_dh:
    description: "Chi tiết đơn hàng — sự kiện bán hàng cấp DÒNG (mỗi dòng = 1 SKU trong 1 đơn). Bảng lớn nhất kho, phân vùng theo ngay_dh."
    synonyms: [chi tiết đơn hàng, dòng đơn hàng, bán hàng, doanh thu, order lines, sales]
    grain: "ma_dh + dong"
    columns:
      ma_dh: {description: "Mã đơn hàng (HD... = POS cửa hàng, ECO-... = online)"}
      dong: {description: "Số thứ tự dòng trong đơn"}
      ngay_dh: {description: "Ngày đặt hàng (cột phân vùng)", synonyms: [ngày bán, ngày đặt, ngày mua]}
      ma_cn: {description: "Mã cửa hàng xử lý đơn -> dw.dim_cn"}
      ma_kenh: {description: "Mã kênh bán: CH=tại cửa hàng, WEB, APP, SAN=sàn TMĐT -> dw.dim_kenh"}
      ma_kh: {description: "Mã khách hàng -> dw.dim_kh (NULL = khách vãng lai)"}
      ma_km: {description: "Mã chương trình khuyến mãi áp dụng -> dw.dim_km"}
      ma_sp: {description: "Mã sản phẩm (SKU) -> dw.dim_sp"}
      trang_thai: {description: "Trạng thái đơn chuẩn hóa: HOAN_THANH, HUY, TRA_HANG (trả toàn bộ), DANG_GIAO, KHAC (mã nguồn chưa map)"}
      sl: {description: "Số lượng bán trên dòng", synonyms: [số lượng]}
      dg: {description: "Đơn giá bán (VND)", synonyms: [đơn giá, giá bán]}
      ck: {description: "Tiền chiết khấu của dòng (VND)", synonyms: [chiết khấu, giảm giá]}
      tt: {description: "Thành tiền sau chiết khấu = sl*dg - ck (VND)", synonyms: [thành tiền]}
      gia_von: {description: "Giá vốn đơn vị của SKU (VND)"}
      sl_tra: {description: "Số lượng khách trả lại (trả một phần)"}
      tien_tra: {description: "Giá trị tiền hoàn cho phần hàng trả (VND)"}
  dw.fct_dh:
    description: "Đơn hàng — sự kiện cấp ĐƠN (header). Dùng cho đếm đơn, tỷ lệ hủy, phương thức thanh toán, phí vận chuyển. KHÔNG join với fct_ct_dh rồi SUM cột của bảng này (nhân bản số liệu)."
    synonyms: [đơn hàng, hóa đơn, orders, header đơn]
    grain: "ma_dh"
    columns:
      ma_dh: {description: "Mã đơn hàng"}
      ngay_dh: {description: "Ngày đặt hàng (cột phân vùng)"}
      tg_dh: {description: "Thời điểm đặt hàng (timestamp)"}
      ma_kh: {description: "Mã khách hàng (NULL = khách vãng lai)"}
      ma_cn: {description: "Mã cửa hàng xử lý đơn"}
      ma_kenh: {description: "Mã kênh bán"}
      ma_nv: {description: "Mã nhân viên bán hàng (chỉ đơn POS)"}
      ma_km: {description: "Mã chương trình khuyến mãi"}
      trang_thai: {description: "Trạng thái đơn chuẩn hóa (HOAN_THANH/HUY/TRA_HANG/DANG_GIAO/KHAC)"}
      pttt: {description: "Phương thức thanh toán", synonyms: [thanh toán, hình thức thanh toán]}
      phi_vc: {description: "Phí vận chuyển thu khách (VND)"}
      so_dong: {description: "Số dòng sản phẩm trong đơn"}
      tien_hang: {description: "Tổng tiền hàng trước chiết khấu (VND)"}
      tien_ck: {description: "Tổng chiết khấu của đơn (VND)"}
      tong_tt: {description: "Tổng thành tiền sau chiết khấu, chưa gồm phí vận chuyển (VND)"}
      nguon: {description: "Hệ thống nguồn: POS hoặc ECOM"}
  dw.fct_th:
    description: "Phiếu trả hàng (ERP) theo ngày trả."
    synonyms: [trả hàng, hoàn hàng, returns]
    columns:
      ma_th: {description: "Mã phiếu trả"}
      ma_dh: {description: "Mã đơn hàng gốc"}
      ma_sp: {description: "Mã sản phẩm trả"}
      ma_cn: {description: "Cửa hàng của đơn gốc"}
      ma_kenh: {description: "Kênh của đơn gốc"}
      ngay_tra: {description: "Ngày trả hàng (cột phân vùng)"}
      sl_tra: {description: "Số lượng trả"}
      ly_do: {description: "Lý do trả hàng"}
      tien_hoan: {description: "Số tiền hoàn cho khách (VND)"}
  dw.fct_tk_tuan:
    description: "Tồn kho — ảnh chụp cuối tuần (Chủ nhật) theo kho × SKU. Chỉ số semi-additive: KHÔNG SUM qua nhiều ngay_chot, phải lọc 1 ngày chốt."
    synonyms: [tồn kho, inventory, hàng tồn, stock]
    columns:
      ngay_chot: {description: "Ngày chốt tồn (Chủ nhật, cột phân vùng)"}
      ma_kho: {description: "Mã kho -> dw.dim_kho"}
      ma_sp: {description: "Mã sản phẩm"}
      sl_ton: {description: "Số lượng tồn cuối ngày chốt", synonyms: [tồn, số lượng tồn]}
      sl_dang_ve: {description: "Số lượng đã đặt NCC, đang về"}
      gia_tri_ton: {description: "Giá trị tồn theo giá vốn (VND)"}
  dw.fct_nk:
    description: "Nhập kho từ nhà cung cấp."
    synonyms: [nhập kho, nhập hàng, mua hàng, purchase]
    columns:
      ma_pn: {description: "Mã phiếu nhập"}
      ngay_nk: {description: "Ngày nhập kho (cột phân vùng)"}
      ma_kho: {description: "Kho nhận hàng"}
      ma_ncc: {description: "Nhà cung cấp -> dw.dim_ncc"}
      ma_sp: {description: "Mã sản phẩm"}
      sl_nhap: {description: "Số lượng nhập"}
      dg_nhap: {description: "Đơn giá nhập (VND)"}
      tt_nhap: {description: "Thành tiền nhập (VND)"}
  dw.fct_kh_dt:
    description: "Kế hoạch (chỉ tiêu) doanh thu thuần theo tháng × cửa hàng — Phòng Tài chính."
    synonyms: [kế hoạch, chỉ tiêu, target, budget]
    columns:
      thang: {description: "Tháng kế hoạch (ngày đầu tháng)"}
      ma_cn: {description: "Mã cửa hàng"}
      dt_ke_hoach: {description: "Doanh thu thuần kế hoạch (VND)"}
  dw.fct_cp_mkt:
    description: "Chi phí marketing theo tháng × kênh."
    synonyms: [chi phí marketing, quảng cáo, marketing spend]
    columns:
      thang: {description: "Tháng (ngày đầu tháng)"}
      ma_kenh: {description: "Mã kênh"}
      chi_phi: {description: "Chi phí marketing (VND)"}
  dw.dim_ngay:
    description: "Lịch ngày (date dimension)."
    synonyms: [lịch, ngày, calendar]
    columns:
      ngay: {description: "Ngày"}
      nam: {description: "Năm"}
      quy: {description: "Quý (1-4)"}
      thang: {description: "Tháng (1-12)"}
      tuan: {description: "Tuần ISO trong năm"}
      thu: {description: "Thứ trong tuần ISO (1=Thứ 2 ... 7=Chủ nhật)"}
      ten_thu: {description: "Tên thứ"}
      cuoi_tuan: {description: "TRUE nếu Thứ 7/Chủ nhật"}
      ngay_le: {description: "TRUE nếu là ngày lễ/nghỉ Tết"}
      ten_le: {description: "Tên ngày lễ"}
      nam_thang: {description: "Chuỗi YYYY-MM"}
  dw.dim_vung:
    description: "Vùng miền: B=Miền Bắc, T=Miền Trung, N=Miền Nam."
    synonyms: [vùng, miền, khu vực]
    columns:
      ma_vung: {description: "Mã vùng (B/T/N)"}
      ten_vung: {description: "Tên vùng"}
  dw.dim_cn:
    description: "Chi nhánh / cửa hàng."
    synonyms: [cửa hàng, chi nhánh, store, siêu thị]
    columns:
      ma_cn: {description: "Mã cửa hàng"}
      ten_cn: {description: "Tên cửa hàng"}
      ma_vung: {description: "Mã vùng"}
      tinh_tp: {description: "Tỉnh/thành phố"}
      loai_ch: {description: "Mô hình: Flagship / Tiêu chuẩn / Mini"}
      dt_m2: {description: "Diện tích (m²)"}
      ngay_mo: {description: "Ngày khai trương"}
      ngay_dong: {description: "Ngày đóng cửa (NULL nếu đang hoạt động)"}
      ma_kho: {description: "Kho cấp hàng"}
      trang_thai: {description: "Đang hoạt động / Đã đóng cửa"}
  dw.dim_kho:
    description: "Kho / trung tâm phân phối."
    synonyms: [kho, dc, warehouse]
    columns:
      ma_kho: {description: "Mã kho"}
      ten_kho: {description: "Tên kho"}
      ma_vung: {description: "Mã vùng"}
      tinh_tp: {description: "Tỉnh/thành"}
  dw.dim_kenh:
    description: "Kênh bán hàng."
    synonyms: [kênh, channel]
    columns:
      ma_kenh: {description: "CH / WEB / APP / SAN"}
      ten_kenh: {description: "Tên kênh"}
      nhom_kenh: {description: "Offline / Online"}
  dw.dim_nh:
