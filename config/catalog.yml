      gia_von: {description: "Giá vốn (VND)"}
      gia_niem_yet: {description: "Giá bán lẻ niêm yết (VND)"}
      ngay_ra_mat: {description: "Ngày ra mắt / mở bán"}
      ma_ncc: {description: "Nhà cung cấp chính"}
      trang_thai_kd: {description: "Đang KD / Ngừng KD"}
  dw.dim_ncc:
    description: "Nhà cung cấp."
    synonyms: [nhà cung cấp, supplier]
    columns:
      ma_ncc: {description: "Mã NCC"}
      ten_ncc: {description: "Tên NCC"}
      quoc_gia: {description: "Quốc gia xuất xứ thương hiệu"}
  dw.dim_km:
    description: "Chương trình khuyến mãi."
    synonyms: [khuyến mãi, campaign, promotion]
    columns:
      ma_km: {description: "Mã CTKM"}
      ten_km: {description: "Tên chương trình"}
      loai_km: {description: "Loại: Lễ Tết / Ngày lễ / Mùa vụ / Flash sale"}
      tu_ngay: {description: "Ngày bắt đầu"}
      den_ngay: {description: "Ngày kết thúc"}
      pct_giam: {description: "Tỷ lệ giảm giá (0.1 = 10%)"}
  dw.dim_kh:
    description: "Khách hàng định danh (CRM). Chứa PII."
    synonyms: [khách hàng, customer, thành viên]
    columns:
