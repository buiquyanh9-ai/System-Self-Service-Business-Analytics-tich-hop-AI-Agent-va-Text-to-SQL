      gt: {description: "Giới tính: Nam / Nữ / Không rõ"}
      nam_sinh: {description: "Năm sinh"}
      tinh_tp: {description: "Tỉnh/thành nơi ở (đã chuẩn hóa)"}
      ma_vung: {description: "Vùng nơi ở"}
